# Typecheck, lint, tests (including the lineage and citation guards), the dataset's
# lineage check, and a production build. See specs/data-lineage.md#enforcement.
name: Verify

on:
  push:
    branches: [main]
  pull_request:
  # Re-run by hand when GitHub drops a push event (it happened for PR #16's merge).
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run build

  # Every PR adds a note to release-notes/ with its own number (specs/release-notes.md).
  release-note:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/check-release-note.mts
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}

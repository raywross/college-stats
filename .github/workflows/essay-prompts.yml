# Reads colleges' essay prompts pages (scripts/sync-essay-prompts.mts; specs/product/essays/prompts.md) where the
# Anthropic key lives (the repository secret ANTHROPIC_API_KEY; there is no key in local .env files) and writes the
# reader's layers (essays.records, essays.held, essays.pages, essays.runs) to the data project in one change set
# (specs/data-platform/pipelines.md). Held records become holds in the console; the run's report is the change set's
# summary. The last step asks the publisher for a snapshot, unless the change set closed held (more than half of the
# colleges read were held: exit 2) or the run stopped early (budget or key: exit 3); the nightly publish catches up.
# Dispatched by hand only (the owner runs it): the first wave is `top: 200`, then units.
#
# COLLEGE_DOCS_REPO, when set, keeps every page read in the GitHub-release archive.
name: Essay prompts

run-name: "${{ inputs.request_id && format('{0} · {1}', github.workflow, inputs.request_id) || github.workflow }}"

on:
  workflow_dispatch:
    inputs:
      units:
        description: Unit ids to read, comma-separated (overrides top when set)
        type: string
        default: ""
      top:
        description: Read the N colleges with the most applicants (used when units is empty)
        type: string
        default: "200"
      budget:
        description: Stop the run (keeping finished colleges) before a call that could pass this many US dollars
        type: string
        default: "40"
      request_id:
        description: Set by the admin console to find its run; leave empty
        type: string
        default: ""

# contents: write lets the last step send the publish-snapshot repository_dispatch.
permissions:
  contents: write

concurrency:
  group: essay-prompts
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      DATA_SUPABASE_URL: ${{ secrets.DATA_SUPABASE_URL || secrets.PROD_SUPABASE_URL }}
      DATA_SUPABASE_SECRET_KEY: ${{ secrets.DATA_SUPABASE_SECRET_KEY || secrets.PROD_SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the secrets
        run: |
          if [ -z "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            echo "::error::ANTHROPIC_API_KEY is not set (repository secret)."
            exit 1
          fi
          if [ -z "$DATA_SUPABASE_URL" ] || [ -z "$DATA_SUPABASE_SECRET_KEY" ]; then
            echo "::error::DATA_SUPABASE_URL or DATA_SUPABASE_SECRET_KEY is not set (repository secrets)."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Read the essay pages
        id: sync
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COLLEGE_DOCS_REPO: ${{ vars.COLLEGE_DOCS_REPO }}
          COLLEGE_REPORTED_TOKEN: ${{ secrets.COLLEGE_REPORTED_TOKEN }}
          UNITS: ${{ inputs.units }}
          TOP: ${{ inputs.top }}
          BUDGET: ${{ inputs.budget }}
        run: |
          set +e
          if [ -n "$UNITS" ]; then
            npm run sync-essay-prompts -- --store supabase --units "$UNITS" --budget "${BUDGET:-40}"
          else
            npm run sync-essay-prompts -- --store supabase --top "${TOP:-200}" --budget "${BUDGET:-40}"
          fi
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          # 2 = the change set closed held; 3 = stopped early (budget or key), the colleges finished are kept.
          if [ "$code" = "2" ]; then echo "::notice::More than half of the colleges read were held: the change set is held for a look in the console."; exit 0; fi
          if [ "$code" = "3" ]; then echo "::notice::The run stopped early (its budget, or the API key was refused); the colleges it finished are kept."; exit 0; fi
          exit "$code"

      - name: Ask for a snapshot
        if: steps.sync.outputs.exit_code == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/${{ github.repository }}/dispatches -f event_type=publish-snapshot

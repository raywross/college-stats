# Runs the college-reported ingestion agent (specs/college-reported-data.md). Since the data platform's phase 2
# (specs/data-platform/pipelines.md) the run writes its state to the data store, not to data/: one change set per
# run (source college-reported, run_ref the run id), closed `applied`, or `held` when the circuit breaker tripped or
# the run stopped early, and kept open while Message Batches are open. The job ends by asking the publisher for a
# snapshot (repository_dispatch publish-snapshot) unless the set is held or still open; a held set waits in the
# admin console (Holds, Change sets). No commit, no pull request, no release note.
#
# Round 3 (specs/college-reported-round-3.md, Decision 5): extraction runs as Message Batches. The `run` job prepares,
# discovers, submits, and polls until its deadline; batches still open stay in `reported.batches` with the change set
# open. The `collect` job (every 30 minutes, or by hand with mode = collect) finds the oldest open batch's run on the
# store, collects it into the same change set, closes the set when no batch is left, and dispatches the publisher.
name: College-reported data

# The admin console passes request_id on dispatch so it can find its run (specs/product/admin.md, "Reruns"); a run
# without one keeps GitHub's usual title.
run-name: "${{ inputs.request_id && format('{0} · {1}', github.workflow, inputs.request_id) || github.event.head_commit.message || github.workflow }}"

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Which colleges to run
        type: choice
        options: [pilot, all, college, collect]
        default: pilot
      college:
        description: Unit id (only used when mode = college)
        type: string
        default: ""
      rediscover:
        description: Re-run discovery even for colleges with a recipe
        type: boolean
        default: false
      auto_merge:
        description: "No effect since data runs open no pull request (kept so the console's dispatches stay valid)"
        type: boolean
        default: true
      max_discoveries:
        description: Cap on discovery calls this run
        type: string
        default: "100"
      max_cost:
        description: Stop the run (keeping finished colleges) once its estimated cost reaches this many US dollars
        type: string
        default: "25"
      reextract:
        description: "After a schema bump: re-read one call from the archive, no fetch (none, C, or rest)"
        type: choice
        options: [none, C, rest]
        default: none
      request_id:
        description: Set by the admin console to find its run; leave empty
        type: string
        default: ""
  schedule:
    # Two entries because one cron line can't mix a weekly Aug–Nov cadence with a monthly Dec–Jul one (and GitHub's
    # schedule parser doesn't reliably support month ranges combined with a weekday filter); each fires on a plain,
    # widely-supported schedule and the "Check schedule window" step below decides from the current UTC month
    # whether this particular firing should actually run (specs/college-reported-data.md#schedule).
    - cron: "0 13 * * 1" # every Monday 13:00 UTC — proceeds only Aug–Nov (fall class-profile season)
    - cron: "0 13 1 * *" # the 1st of every month, 13:00 UTC — proceeds only Dec–Jul (CDS edition season)
    # The collect job: exits at once unless the store lists an open batch. Only the collect job runs on it.
    - cron: "*/30 * * * *"

# contents: write is what sending repository_dispatch (the publisher) needs; nothing is pushed.
permissions:
  contents: write

concurrency:
  group: college-reported
  cancel-in-progress: false

env:
  # The data project (shared contracts), with the publisher's fallback (.github/workflows/publish-snapshot.yml).
  DATA_SUPABASE_URL: ${{ secrets.DATA_SUPABASE_URL || secrets.PROD_SUPABASE_URL }}
  DATA_SUPABASE_SECRET_KEY: ${{ secrets.DATA_SUPABASE_SECRET_KEY || secrets.PROD_SUPABASE_SECRET_KEY }}

# Both jobs share this group, so a collect never runs while a run is writing the same change set.
jobs:
  run:
    if: github.event.schedule != '*/30 * * * *' && (github.event_name != 'workflow_dispatch' || inputs.mode != 'collect')
    runs-on: ubuntu-latest
    # GitHub-hosted jobs stop at 6 hours; the script polls batches until COLLEGE_REPORTED_POLL_UNTIL (300 minutes in).
    # Open batches go to the collect job.
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - name: Check schedule window
        id: window
        if: github.event_name == 'schedule'
        run: |
          month=$(date -u +%-m)
          event="${{ github.event.schedule }}"
          proceed=false
          if [ "$event" = "0 13 * * 1" ]; then
            # Weekly-Monday cron: only Aug (8) through Nov (11).
            if [ "$month" -ge 8 ] && [ "$month" -le 11 ]; then proceed=true; fi
          elif [ "$event" = "0 13 1 * *" ]; then
            # Monthly-1st cron: only Dec (12) through Jul (7).
            if [ "$month" -eq 12 ] || [ "$month" -le 7 ]; then proceed=true; fi
          fi
          echo "This firing: $event, month $month, proceed=$proceed"
          echo "proceed=$proceed" >> "$GITHUB_OUTPUT"

      - name: Resolve run parameters
        id: params
        if: github.event_name != 'schedule' || steps.window.outputs.proceed == 'true'
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "mode=all" >> "$GITHUB_OUTPUT"
            echo "college=" >> "$GITHUB_OUTPUT"
            echo "rediscover=false" >> "$GITHUB_OUTPUT"
            echo "max_discoveries=100" >> "$GITHUB_OUTPUT"
            echo "max_cost=150" >> "$GITHUB_OUTPUT"
            echo "reextract=none" >> "$GITHUB_OUTPUT"
          else
            mode="${{ inputs.mode }}"
            college="${{ inputs.college }}"
            if [ "$mode" = "college" ] && [ -z "$college" ]; then
              echo "::error::mode=college requires the college input (a unit id)."
              exit 1
            fi
            echo "mode=$mode" >> "$GITHUB_OUTPUT"
            echo "college=$college" >> "$GITHUB_OUTPUT"
            echo "rediscover=${{ inputs.rediscover }}" >> "$GITHUB_OUTPUT"
            echo "max_discoveries=${{ inputs.max_discoveries }}" >> "$GITHUB_OUTPUT"
            echo "reextract=${{ inputs.reextract }}" >> "$GITHUB_OUTPUT"
            echo "max_cost=${{ inputs.max_cost }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute run id
        id: run_id
        if: github.event_name != 'schedule' || steps.window.outputs.proceed == 'true'
        run: |
          echo "id=$(date -u +%Y%m%d-%H%M%S)-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          # The script stops polling open batches at this time (ISO, UTC) and leaves them to the collect job.
          echo "poll_until=$(date -u -d '+300 minutes' +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Check for the Anthropic API key and the data store
        id: secret
        if: github.event_name != 'schedule' || steps.window.outputs.proceed == 'true'
        run: |
          if [ -z "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            echo "::notice::ANTHROPIC_API_KEY is not set; skipping this run. See specs/college-reported-setup.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$DATA_SUPABASE_URL" ] || [ -z "$DATA_SUPABASE_SECRET_KEY" ]; then
            echo "::notice::DATA_SUPABASE_URL or DATA_SUPABASE_SECRET_KEY is not set; skipping this run (the state lives on the data store)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build script flags
        id: flags
        if: steps.secret.outputs.ready == 'true'
        run: |
          flags="--store supabase --run ${{ steps.run_id.outputs.id }}"
          case "${{ steps.params.outputs.mode }}" in
            pilot) flags="$flags --pilot" ;;
            all) flags="$flags --all" ;;
            college) flags="$flags --college ${{ steps.params.outputs.college }}" ;;
          esac
          if [ "${{ steps.params.outputs.rediscover }}" = "true" ]; then
            flags="$flags --rediscover"
          fi
          flags="$flags --max-discoveries ${{ steps.params.outputs.max_discoveries }}"
          flags="$flags --max-cost ${{ steps.params.outputs.max_cost }}"
          # After a schema bump: re-read one call from the archive, no fetch (lib/cds-sections.ts SCHEMA_VERSIONS).
          case "${{ steps.params.outputs.reextract }}" in
            C|rest) flags="$flags --reextract --call ${{ steps.params.outputs.reextract }}" ;;
          esac
          echo "flags=$flags" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.secret.outputs.ready == 'true'
        with:
          node-version: 24
          cache: npm

      - run: npm ci
        if: steps.secret.outputs.ready == 'true'

      # pdftotext (poppler) lays out each PDF so C7/C8A marks are placed under their column headings after a model
      # read (scripts/lib/college-reported/grid-place.mts). Without it the marks stay held by the grid-column check.
      - name: Install pdftotext
        if: steps.secret.outputs.ready == 'true'
        run: command -v pdftotext || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils)

      # Discovery's cached documents (.cache/college-docs/, git-ignored): keyed per run so a run always starts from
      # the newest prior cache, and never writes over another run's in-flight cache.
      - name: Restore document cache
        if: steps.secret.outputs.ready == 'true'
        uses: actions/cache@v4
        with:
          path: .cache/college-docs
          key: college-docs-${{ steps.run_id.outputs.id }}
          restore-keys: |
            college-docs-

      # Writes to the store after every college; the script writes `change_set`, `status` (open | applied | held) and
      # `open_batches` to this step's outputs.
      - name: Run the ingestion pipeline
        id: sync
        if: steps.secret.outputs.ready == 'true'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COLLEGE_REPORTED_POLL_UNTIL: ${{ steps.run_id.outputs.poll_until }}
        run: |
          set +e
          npm run sync-college-reported -- ${{ steps.flags.outputs.flags }}
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          # 0 = normal, 2 = circuit breaker tripped, 3 = stopped early (the run's max_cost, the spend limit, credit
          # balance, or key refused); 2 and 3 close the change set held. 1 = error (the set is held too) fails the step.
          if [ "$code" = "1" ]; then
            echo "::error::sync-college-reported exited 1 (error); see the job log above."
            exit 1
          fi

      # The run's tail (shared contracts): ask the publisher for a snapshot, unless the set is held (exit 2 or 3, or
      # an error) or still open (batches pending: the collect job dispatches once they are in).
      - name: Ask the publisher for a snapshot
        if: always() && steps.secret.outputs.ready == 'true' && steps.sync.outputs.exit_code == '0' && steps.sync.outputs.status == 'applied'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/${{ github.repository }}/dispatches -f event_type=publish-snapshot

      - name: Say why there is no publish
        if: always() && steps.secret.outputs.ready == 'true' && !(steps.sync.outputs.exit_code == '0' && steps.sync.outputs.status == 'applied')
        env:
          EXIT_CODE: ${{ steps.sync.outputs.exit_code }}
          STATUS: ${{ steps.sync.outputs.status }}
          CHANGE_SET: ${{ steps.sync.outputs.change_set }}
          OPEN_BATCHES: ${{ steps.sync.outputs.open_batches }}
        run: |
          if [ "$STATUS" = "open" ]; then
            echo "::notice::Change set ${CHANGE_SET} stays open: ${OPEN_BATCHES} batch(es) still open. The collect job finishes them and asks for the snapshot."
          elif [ "$EXIT_CODE" = "2" ]; then
            echo "::warning::The circuit breaker tripped: change set ${CHANGE_SET} is held. Look at it in the console (Change sets): Publish anyway or Revert."
          elif [ "$EXIT_CODE" = "3" ]; then
            echo "::warning::The run stopped early: change set ${CHANGE_SET} is held with what it finished. Publish anyway or Revert in the console."
          else
            echo "::warning::The run did not finish (exit ${EXIT_CODE:-none}); its change set ${CHANGE_SET:-} is held or was never opened."
          fi

  collect:
    if: github.event.schedule == '*/30 * * * *' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'collect')
    runs-on: ubuntu-latest
    # Shorter than the cron's 30 minutes, so a collect never queues behind another and (through the shared concurrency
    # group) never displaces a pending scheduled run. Collecting is idempotent: a collect cut off before it writes leaves
    # the batches listed, and the next one collects them again (results are kept 29 days).
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Check for the Anthropic API key and the data store
        id: secret
        run: |
          if [ -z "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            echo "::notice::ANTHROPIC_API_KEY is not set; skipping. See specs/college-reported-setup.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$DATA_SUPABASE_URL" ] || [ -z "$DATA_SUPABASE_SECRET_KEY" ]; then
            echo "::notice::DATA_SUPABASE_URL or DATA_SUPABASE_SECRET_KEY is not set; skipping."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.secret.outputs.ready == 'true'
        with:
          node-version: 24
          cache: npm

      - run: npm ci
        if: steps.secret.outputs.ready == 'true'

      # The run of the oldest open batch on the store (`reported.batches`). None → every later step is skipped.
      - name: Find a run with open batches
        id: find
        if: steps.secret.outputs.ready == 'true'
        run: |
          run_id=$(node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/sync-college-reported.mts --print-open-run --store supabase | tail -n 1)
          if [ -z "$run_id" ]; then
            echo "No open batches on the store; nothing to collect."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Collecting the open batches of run $run_id."
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      # pdftotext (poppler) lays out each PDF so C7/C8A marks are placed under their column headings after a model
      # read (scripts/lib/college-reported/grid-place.mts). Without it the marks stay held by the grid-column check.
      - name: Install pdftotext
        if: steps.find.outputs.found == 'true'
        run: command -v pdftotext || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils)

      # The same document cache as the run job (escalation re-reads archived text). Its own key per collect, so a
      # collect never writes over the run's entry; restore-keys picks the newest.
      - name: Restore document cache
        if: steps.find.outputs.found == 'true'
        uses: actions/cache@v4
        with:
          path: .cache/college-docs
          key: college-docs-${{ steps.find.outputs.run_id }}-collect-${{ github.run_id }}
          restore-keys: |
            college-docs-

      # Writes into the run's open change set (or a new one with the same run_ref) and closes it when no batch is left.
      - name: Collect the open batches
        id: sync
        if: steps.find.outputs.found == 'true'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RUN_ID: ${{ steps.find.outputs.run_id }}
        run: |
          set +e
          npm run sync-college-reported -- --store supabase --phase collect --run "$RUN_ID"
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          # Same exit codes as the run job: 0 normal, 2 breaker, 3 stopped early, 1 error (fails the step).
          if [ "$code" = "1" ]; then
            echo "::error::sync-college-reported --phase collect exited 1 (error); see the job log above."
            exit 1
          fi

      # As in the run job: the publisher, once the set closed applied (skipped when held or still open).
      - name: Ask the publisher for a snapshot
        if: always() && steps.find.outputs.found == 'true' && steps.sync.outputs.exit_code == '0' && steps.sync.outputs.status == 'applied'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/${{ github.repository }}/dispatches -f event_type=publish-snapshot

      - name: Say why there is no publish
        if: always() && steps.find.outputs.found == 'true' && !(steps.sync.outputs.exit_code == '0' && steps.sync.outputs.status == 'applied')
        env:
          EXIT_CODE: ${{ steps.sync.outputs.exit_code }}
          STATUS: ${{ steps.sync.outputs.status }}
          CHANGE_SET: ${{ steps.sync.outputs.change_set }}
          OPEN_BATCHES: ${{ steps.sync.outputs.open_batches }}
        run: |
          if [ "$STATUS" = "open" ]; then
            echo "Change set ${CHANGE_SET} stays open: ${OPEN_BATCHES} batch(es) still open; the next collect continues."
          else
            echo "::warning::The collect ended with exit ${EXIT_CODE:-none}: change set ${CHANGE_SET:-} is held. Look at it in the console (Change sets)."
          fi

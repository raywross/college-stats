# Publishes data/*.json to the PRODUCTION Supabase project when a push to main changes data/** (or when run by
# hand), then asks the site to regenerate its static pages. After each Vercel production deploy it revalidates
# again, in case that deploy prerendered its pages before the publish finished.
# Skips cleanly while the PROD_* repository secrets aren't set. See specs/supabase.md#production.
name: Publish data

on:
  push:
    branches: [main]
    paths: ["data/**"]
  workflow_dispatch:
  deployment_status:

permissions:
  contents: read

jobs:
  publish:
    # Only main is ever published to prod, even when run by hand from another branch.
    if: github.event_name != 'deployment_status' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # One publish at a time; a newer queued run replaces an older queued one.
    concurrency:
      group: publish-data-prod
      cancel-in-progress: false
    env:
      SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.PROD_SUPABASE_SECRET_KEY }}
      REVALIDATE_URL: ${{ secrets.PROD_REVALIDATE_URL }}
      REVALIDATE_SECRET: ${{ secrets.PROD_REVALIDATE_SECRET }}
    steps:
      - name: Check for prod secrets
        id: secrets
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SECRET_KEY" ]; then
            echo "::notice::PROD_SUPABASE_URL or PROD_SUPABASE_SECRET_KEY is not set; skipping the prod publish."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@v4
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - if: steps.secrets.outputs.ready == 'true'
        run: npm ci
      # Lineage check, shrink guard, one-transaction publish, exact read-back, then revalidation.
      - if: steps.secrets.outputs.ready == 'true'
        run: npm run publish-data

  revalidate-after-deploy:
    # Vercel reports deployments to GitHub; its production environment is named "Production" (or
    # "Production – <project>").
    if: >-
      github.event_name == 'deployment_status' &&
      github.event.deployment_status.state == 'success' &&
      startsWith(github.event.deployment.environment, 'Production')
    runs-on: ubuntu-latest
    env:
      REVALIDATE_URL: ${{ secrets.PROD_REVALIDATE_URL }}
      REVALIDATE_SECRET: ${{ secrets.PROD_REVALIDATE_SECRET }}
    steps:
      - name: Revalidate static pages
        run: |
          if [ -z "$REVALIDATE_URL" ] || [ -z "$REVALIDATE_SECRET" ]; then
            echo "::notice::PROD_REVALIDATE_URL or PROD_REVALIDATE_SECRET is not set; skipping."
            exit 0
          fi
          curl -fsS --retry 3 -X POST -H "Authorization: Bearer $REVALIDATE_SECRET" "$REVALIDATE_URL"

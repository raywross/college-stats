# Runs the campus-life pilot (scripts/campus-pilot.mts; specs/religious-life.md phase 2, greek-life.md phase 2,
# lgbtq-life.md phase 4) on a list of pilot colleges (default: round 3's 25, data/reference/campus-pilot-3-colleges.json),
# where the Anthropic key lives (the repository secret ANTHROPIC_API_KEY; there is no key in local .env files). It runs
# the pilot and scores it against the hand-checked answer key when one exists, writing campus.pages, campus.sources,
# the reports and refusals to the data store in one change set (source campus-pilot), which this workflow opens first
# and closes last (scripts/data-change-set.mts; specs/data-platform/pipelines.md). Pilot results are reviewed before
# they go live, so the set closes held for the console's Holds ("Publish anyway" puts it live) unless `publish` is
# set; only an applied set asks the publisher for a snapshot. Never runs on a schedule (owner decision 2: pilot
# colleges only, no full run). A run changes only the colleges it reads: every other college's published facts and
# recipes are kept as they were. No commit, no pull request.
name: Campus-life pilot

on:
  workflow_dispatch:
    inputs:
      colleges_file:
        description: "College list file to run: a colleges array of unit_id objects"
        type: string
        default: data/reference/campus-pilot-3-colleges.json
      college:
        description: Unit ids to run, space-separated (overrides the list when set)
        type: string
        default: ""
      cap:
        description: Spend cap in US dollars for this run (the pilot stops starting calls once reached)
        type: string
        default: "15"
      rediscover:
        description: Run discovery again even for colleges with saved links
        type: boolean
        default: false
      batch:
        description: Send extraction and second checks as Message Batches (half price; a batch not done in 20 minutes is cancelled and its calls made directly)
        type: boolean
        default: true
      publish:
        description: Publish the results without review (default holds them in the console's Holds)
        type: boolean
        default: false

permissions:
  contents: write # the publish-snapshot dispatch

concurrency:
  group: campus-pilot
  cancel-in-progress: false

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      DATA_SUPABASE_URL: ${{ secrets.DATA_SUPABASE_URL || secrets.PROD_SUPABASE_URL }}
      DATA_SUPABASE_SECRET_KEY: ${{ secrets.DATA_SUPABASE_SECRET_KEY || secrets.PROD_SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the API key
        id: secret
        run: |
          if [ -z "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            echo "::error::ANTHROPIC_API_KEY is not set (repository secret)."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Open the change set
        id: change_set
        run: |
          id=$(node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/data-change-set.mts open --store supabase --source campus-pilot --run-ref "$GITHUB_RUN_ID")
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Run the pilot
        id: pilot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COLLEGES: ${{ inputs.college }}
          COLLEGES_FILE: ${{ inputs.colleges_file }}
          CAP: ${{ inputs.cap }}
          REDISCOVER: ${{ inputs.rediscover }}
          BATCH: ${{ inputs.batch }}
          CHANGE_SET: ${{ steps.change_set.outputs.id }}
        run: |
          args="--store supabase --change-set $CHANGE_SET --cap ${CAP:-15} --colleges-file ${COLLEGES_FILE:-data/reference/campus-pilot-3-colleges.json}"
          for id in $COLLEGES; do args="$args --college $id"; done
          if [ "$REDISCOVER" = "true" ]; then args="$args --rediscover"; fi
          if [ "$BATCH" = "false" ]; then args="$args --no-batch"; fi
          npm run campus-pilot -- $args

      - name: Score against the answer key
        id: score
        env:
          CHANGE_SET: ${{ steps.change_set.outputs.id }}
        run: |
          if npm run --silent score-campus-pilot -- --key data/reports/campus-pilot-answer-key.json --store supabase --change-set "$CHANGE_SET"; then
            echo "Scored."
          else
            echo "::notice::No answer key (or no report) to score against; skipping the score."
          fi

      # The console's health document counts campus-page facts and blocked hosts; rebuilt into the same change set.
      - name: Rebuild the health document
        env:
          CHANGE_SET: ${{ steps.change_set.outputs.id }}
        run: npm run college-health -- --store supabase --change-set "$CHANGE_SET"

      - name: Close the change set
        id: close
        if: always() && steps.change_set.outputs.id != ''
        env:
          ID: ${{ steps.change_set.outputs.id }}
          PILOT_OK: ${{ steps.pilot.outcome }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          if [ "$PILOT_OK" != "success" ]; then
            node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/data-change-set.mts close --store supabase --id "$ID" --status held --reason "The campus-life pilot did not finish (${PILOT_OK:-n/a}); this set holds whatever it wrote"
            echo "status=held" >> "$GITHUB_OUTPUT"
          elif [ "$PUBLISH" = "true" ]; then
            node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/data-change-set.mts close --store supabase --id "$ID" --status applied
            echo "status=applied" >> "$GITHUB_OUTPUT"
          else
            node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/data-change-set.mts close --store supabase --id "$ID" --status held --reason "Campus-life pilot run ${GITHUB_RUN_ID}: review the facts before they go live"
            echo "status=held" >> "$GITHUB_OUTPUT"
          fi

      # The run's tail: ask the publisher for a snapshot, unless the set was held (the console shows the hold).
      - name: Ask the publisher for a snapshot
        if: always() && steps.close.outputs.status == 'applied'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${{ github.repository }}/dispatches" -f event_type=publish-snapshot

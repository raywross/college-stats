# Runs the high school profile pilot (scripts/sync-hs-profiles.mts; specs/product/high-school-data.md "Pilot results")
# where the Anthropic key lives (the repository secret ANTHROPIC_API_KEY; there is no key in local .env files). It runs
# the pilot's 100 schools (the profile-pilot document), extracts the answer key's schools, and scores the extraction
# against data/reference/hs-profile-answer-key.json, writing the high-school layers (specs/data-platform/pipelines.md)
# in one change set that all three steps share (opened and closed with scripts/data-change-set.mts).
#
# The pilot's results were reviewed on a branch before; now the change set closes held, so nothing from a pilot is
# published until the owner looks at it in the console (Change sets) and chooses Publish anyway or Revert. So this
# workflow never asks for a snapshot. No commit, no PR; never runs on a schedule (the spec: demand-driven expansion,
# never all high schools). The spend cap counts spend recorded by earlier runs in the profile-pilot document.
name: High school profile pilot

run-name: "${{ inputs.request_id && format('{0} · {1}', github.workflow, inputs.request_id) || github.workflow }}"

on:
  workflow_dispatch:
    inputs:
      cap:
        description: Total pilot spend cap in US dollars (earlier runs count toward it)
        type: string
        default: "30"
      only:
        description: School ids to run, comma-separated (overrides the pilot list when set)
        type: string
        default: ""
      answer_key:
        description: Also extract the answer key's schools and score against the key
        type: boolean
        default: true
      request_id:
        description: Set by the admin console to find its run; leave empty
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: hs-profile-pilot
  cancel-in-progress: false

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      DATA_SUPABASE_URL: ${{ secrets.DATA_SUPABASE_URL || secrets.PROD_SUPABASE_URL }}
      DATA_SUPABASE_SECRET_KEY: ${{ secrets.DATA_SUPABASE_SECRET_KEY || secrets.PROD_SUPABASE_SECRET_KEY }}
    steps:
      - name: Check the secrets
        run: |
          if [ -z "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            echo "::error::ANTHROPIC_API_KEY is not set (repository secret)."
            exit 1
          fi
          if [ -z "$DATA_SUPABASE_URL" ] || [ -z "$DATA_SUPABASE_SECRET_KEY" ]; then
            echo "::error::DATA_SUPABASE_URL or DATA_SUPABASE_SECRET_KEY is not set (repository secrets)."
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Open the change set
        id: set
        run: |
          id=$(node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/data-change-set.mts open --kind pipeline --source high-schools --run-ref "$GITHUB_RUN_ID" | tail -n 1)
          if ! [[ "$id" =~ ^[0-9]+$ ]]; then echo "::error::no change set id (got: $id)"; exit 1; fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Run the pilot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CAP: ${{ inputs.cap }}
          ONLY: ${{ inputs.only }}
          SET: ${{ steps.set.outputs.id }}
        run: |
          if [ -n "$ONLY" ]; then
            npm run sync-hs-profiles -- --store supabase --change-set "$SET" --only "$ONLY" --cap "${CAP:-30}"
          else
            npm run sync-hs-profiles -- --store supabase --change-set "$SET" --pilot --cap "${CAP:-30}"
          fi

      - name: Extract the answer key's schools and score
        if: inputs.answer_key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CAP: ${{ inputs.cap }}
          SET: ${{ steps.set.outputs.id }}
        run: |
          npm run sync-hs-profiles -- --store supabase --change-set "$SET" --answer-key --cap "${CAP:-30}"
          npm run sync-hs-profiles -- --store supabase --change-set "$SET" --score

      # Held either way: a finished pilot waits for a look; a failed one keeps what its steps wrote, also for a look.
      - name: Close the change set
        if: always() && steps.set.outputs.id != ''
        env:
          SET: ${{ steps.set.outputs.id }}
          OUTCOME: ${{ job.status }}
        run: |
          if [ "$OUTCOME" = "success" ]; then
            reason="High school profile pilot: the results wait for a look before they are published."
          else
            reason="High school profile pilot: a step failed; the results so far wait for a look."
          fi
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/data-change-set.mts close --id "$SET" --status held --reason "$reason"

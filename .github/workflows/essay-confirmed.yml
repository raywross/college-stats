# Exports the essay prompts read from the application form by hand (saved in the admin console to
# public.essay_prompt_overrides; the advisor already shows them live) into data/essay-prompts/confirmed/, applies them
# to data/schools.json (npm run export-essay-confirmed runs npm run merge-essay-prompts), checks lineage, and opens a
# data PR with its own release note when anything changed, set to auto-merge once CI is green. Nightly, and by hand.
# The hand-read brief, "Git catches up nightly"; specs/product/essays/sources.md "The hand read".
#
# Reads the table with PROD_SUPABASE_URL and PROD_SUPABASE_SECRET_KEY (the names publish-changes uses); without them it
# says so and stops. Checkout and the git/gh steps use secrets.COLLEGE_REPORTED_TOKEN when it's set (so the PR triggers
# Verify, and auto-merge can happen), falling back to github.token.
name: Essay prompts read by hand

on:
  schedule:
    - cron: "30 7 * * *" # every day, 07:30 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: essay-confirmed
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.PROD_SUPABASE_SECRET_KEY }}
    steps:
      - name: Check the database secrets
        id: secret
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SECRET_KEY" ]; then
            echo "::notice::PROD_SUPABASE_URL or PROD_SUPABASE_SECRET_KEY is not set; nothing to export."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secret.outputs.ready == 'true'
        with:
          token: ${{ secrets.COLLEGE_REPORTED_TOKEN || github.token }}

      - uses: actions/setup-node@v4
        if: steps.secret.outputs.ready == 'true'
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: steps.secret.outputs.ready == 'true'

      - name: Export the hand-read prompts and apply them
        id: export
        if: steps.secret.outputs.ready == 'true'
        run: |
          npm run export-essay-confirmed | tee /tmp/essay-confirmed.log
          npm run check:lineage

      - name: Check for data changes
        id: diff
        if: steps.secret.outputs.ready == 'true'
        run: |
          if git status --porcelain -- data | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes under data/ this run; nothing to open a PR for."
          fi

      - name: Open a pull request
        id: pr
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.COLLEGE_REPORTED_TOKEN || github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          date=$(date -u +%Y-%m-%d)
          branch="data/essay-confirmed-${date}"
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then branch="${branch}-${RUN_ID}"; fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          git checkout -b "$branch"
          git add data
          printf 'Essay prompts read by hand: export %s\n\nCo-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>\n' "$date" > /tmp/essay-confirmed-commit-msg.txt
          git -c user.name="essay-confirmed-bot" -c user.email="noreply@anthropic.com" commit -F /tmp/essay-confirmed-commit-msg.txt
          git push -u origin "$branch"
          {
            echo "The essay prompts saved in the admin console (read from each college's application form by hand), exported to \`data/essay-prompts/confirmed/\` and applied to \`data/schools.json\`. The advisor already shows them; this brings the public college pages and the citation trail up to date."
            echo
            echo '```'
            grep -E '^(essay-confirmed|essays):|::warning::' /tmp/essay-confirmed.log || true
            echo '```'
            echo
            echo "Files:"
            git diff --name-status HEAD~1 -- data/essay-prompts/confirmed | sed 's/^/- /'
          } > /tmp/essay-confirmed-pr-body.md
          gh pr create --base main --head "$branch" \
            --title "Essay prompts read by hand: ${date}" \
            --body-file /tmp/essay-confirmed-pr-body.md
          number=$(gh pr view "$branch" --json number -q .number)
          echo "number=$number" >> "$GITHUB_OUTPUT"

      # The PR number is only known once the PR exists, so the release note (specs/release-notes.md) is written and
      # pushed as a second commit onto the same branch, naming it.
      - name: Add the release note
        if: steps.diff.outputs.changed == 'true' && steps.pr.outputs.number != ''
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          BRANCH: ${{ steps.pr.outputs.branch }}
        run: |
          date=$(date -u +%Y-%m-%d)
          note="release-notes/${BRANCH#data/}.md"
          n=$(git diff --name-only HEAD~1 -- data/essay-prompts/confirmed | wc -l | tr -d ' ')
          word=colleges; if [ "$n" = "1" ]; then word=college; fi
          printf -- '---\ntitle: "Essay questions read from the application form"\npr: %s\ndate: %s\nkind: data\nsummary: "Essay questions read by hand from the application form for %s %s, now on their college pages too."\n---\n\n## What'"'"'s new\n- Essay and short-answer questions that some colleges ask only inside the application, read from the form by hand, now show on the college pages ("From the application form, read by hand on" the day they were read).\n\n## Behind the scenes\n- The nightly export of the admin console'"'"'s saved prompts into data/essay-prompts/confirmed/ (%s files changed), applied by the essay prompts merge.\n' "$PR_NUMBER" "$date" "$n" "$word" "$n" > "$note"
          git add "$note"
          printf 'Release note for #%s\n\nCo-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>\n' "$PR_NUMBER" > /tmp/essay-confirmed-note-msg.txt
          git -c user.name="essay-confirmed-bot" -c user.email="noreply@anthropic.com" commit -F /tmp/essay-confirmed-note-msg.txt
          git push

      - name: Auto-merge once CI is green
        if: steps.diff.outputs.changed == 'true' && steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.COLLEGE_REPORTED_TOKEN || github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: gh pr merge "$PR_NUMBER" --auto --squash

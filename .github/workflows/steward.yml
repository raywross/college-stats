# The Data Steward (specs/product/data-steward.md "Where it runs"): scripts/steward.mts, a scripted agent with fixed
# tools that reads the review queue and writes issues, proposals, To do rows, decisions, audits and a run record to the
# data store's steward.* collections, in one change set (source steward). It never writes reported.*, never asks the
# publisher for a snapshot, and dispatches nothing paid. The console's Proposals screen reviews what it wrote.
# - After every college-reported run that read or collected something (workflow_run): mode run, budget $5. The
#   half-hourly collect firings that find no open batch, and off-season firings, are skipped by the gate below.
# - By hand or from the console (workflow_dispatch): mode run | audit | answer with a budget (default $20), an optional
#   cause (a cluster key), unit (a college), or proposal (answer the owner's question on it).
# - Sundays 09:00 UTC: mode audit, budget $10 (one check family in rotation).
# - mode apply with a proposal: no model; the console's Approve dispatches it for hold, refile, recipe and reject rows.
#   Its change set has source steward-apply, and only when a hold or refile changed a record does it start the
#   publisher (a workflow_dispatch of publish-snapshot.yml, which is why that job alone has actions: write).
# - Job review (the review job; specs/product/admin-redesign.md "What the Steward reviews"): after every scheduled
#   workflow completes (workflow_run), and when a Vercel job's run is recorded (lib/jobs/record.ts dispatches mode
#   review with job and run), mode review reads that one run, writes steward.reviews, and for a flagged or failed run
#   one Haiku note ($0.10 a run, $3 a week), a finding, and the one repair its fixed tools allow: start a restartable
#   job's workflow again (once a day) or the publisher, or leave a finding on a held change. College-reported keeps
#   its run path above and is reviewed too. A run already reviewed is skipped by the script.
# The script enforces the budget and the week's $40 cap. Skips with a notice while a secret is missing.
name: Data Steward

# The admin console passes request_id on dispatch so it can find its run (specs/product/admin.md, "Reruns").
run-name: "${{ inputs.request_id && format('{0} · {1}', github.workflow, inputs.request_id) || github.workflow }}"

on:
  # Every scheduled workflow but this one (lib/jobs/registry.ts; tests/steward-workflow.test.mts keeps them in step).
  workflow_run:
    workflows: ["College-reported data", "Identity refresh", "Visit events", "Publish snapshot", "Sync data", "Sync history"]
    types: [completed]
  schedule:
    - cron: "0 9 * * 0"
  workflow_dispatch:
    inputs:
      mode:
        description: What the Steward does
        type: choice
        options: [run, audit, apply, answer, review]
        default: run
      budget:
        description: Stop at this many US dollars of model calls (the week's $40 cap still applies)
        type: string
        default: "20"
      cause:
        description: One cluster's key to work (mode run); leave empty for the largest clusters
        type: string
        default: ""
      unit:
        description: One college's unit id to work (mode run); leave empty for the whole queue
        type: string
        default: ""
      proposal:
        description: The proposal to apply (mode apply) or whose question to answer (mode answer)
        type: string
        default: ""
      request_id:
        description: Set by the admin console to find its run; leave empty
        type: string
        default: ""
      job:
        description: The job whose run to review (mode review), an id from the console's Jobs
        type: string
        default: ""
      run:
        description: The run to review (mode review), a job_runs id or a workflow run id
        type: string
        default: ""

permissions:
  contents: read

env:
  # The data project, with the publisher's fallback (.github/workflows/publish-snapshot.yml).
  DATA_SUPABASE_URL: ${{ secrets.DATA_SUPABASE_URL || secrets.PROD_SUPABASE_URL }}
  DATA_SUPABASE_SECRET_KEY: ${{ secrets.DATA_SUPABASE_SECRET_KEY || secrets.PROD_SUPABASE_SECRET_KEY }}

jobs:
  steward:
    if: (github.event_name == 'workflow_run' && github.event.workflow_run.name == 'College-reported data') || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'apply' && inputs.mode != 'review')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # One Steward run at a time; a queued one waits (each reads the queue as it then stands). Reviews don't wait on it.
    concurrency:
      group: steward
      cancel-in-progress: false
    # actions: read lets the gate look at the college-reported run's steps; nothing here writes to the repository.
    permissions:
      contents: read
      actions: read
    steps:
      - name: Resolve the mode and budget
        id: params
        env:
          EVENT: ${{ github.event_name }}
          IN_MODE: ${{ inputs.mode }}
          IN_BUDGET: ${{ inputs.budget }}
          IN_CAUSE: ${{ inputs.cause }}
          IN_UNIT: ${{ inputs.unit }}
          IN_PROPOSAL: ${{ inputs.proposal }}
        run: |
          case "$EVENT" in
            workflow_run) mode=run; budget=5 ;;
            schedule) mode=audit; budget=10 ;;
            *) mode="$IN_MODE"; budget="${IN_BUDGET:-20}" ;;
          esac
          if ! [[ "$budget" =~ ^[0-9]{1,5}(\.[0-9]{1,2})?$ ]]; then echo "::error::budget must be a dollar amount"; exit 1; fi
          if [ -n "$IN_UNIT" ] && ! [[ "$IN_UNIT" =~ ^[0-9]{6}$ ]]; then echo "::error::unit must be a six-digit unit id"; exit 1; fi
          if [ "$mode" = "answer" ] && [ -z "$IN_PROPOSAL" ]; then echo "::error::mode answer needs a proposal"; exit 1; fi
          {
            echo "mode=$mode"
            echo "budget=$budget"
          } >> "$GITHUB_OUTPUT"

      # After college-reported: only when its run job read colleges or its collect job collected batches (the
      # half-hourly collect that finds nothing, and an off-season firing, complete the workflow too).
      - name: Check that the college-reported run changed the queue
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT" != "workflow_run" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$CONCLUSION" != "success" ]; then
            echo "::notice::college-reported run $RUN_ID ended $CONCLUSION; the Steward waits for the next one."
            echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          worked=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" --jq '[.jobs[].steps[] | select((.name == "Run the ingestion pipeline" or .name == "Collect the open batches") and .conclusion == "success")] | length')
          if [ "${worked:-0}" -gt 0 ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else
            echo "college-reported run $RUN_ID read and collected nothing; no Steward run."
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for the Anthropic API key and the data store
        id: secrets
        if: steps.gate.outputs.go == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::notice::ANTHROPIC_API_KEY is not set; no Steward run."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$DATA_SUPABASE_URL" ] || [ -z "$DATA_SUPABASE_SECRET_KEY" ]; then
            echo "::notice::DATA_SUPABASE_URL or DATA_SUPABASE_SECRET_KEY is not set; no Steward run (the queue lives on the data store)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: 24
          cache: npm

      - run: npm ci
        if: steps.secrets.outputs.ready == 'true'

      # The bundled copy (.data/snapshot/): what the site shows now, which read_site_value cites.
      - name: Fetch the current snapshot
        if: steps.secrets.outputs.ready == 'true'
        env:
          DATA_SNAPSHOT_URL: ${{ vars.DATA_SNAPSHOT_URL }}
        run: |
          export DATA_SNAPSHOT_URL="${DATA_SNAPSHOT_URL:-${DATA_SUPABASE_URL%/}/storage/v1/object/public/snapshots}"
          npm run fetch-snapshot

      # pdftotext (poppler) lays out form PDFs; flattened PDFs are laid out by the pipeline's own reader.
      - name: Install pdftotext
        if: steps.secrets.outputs.ready == 'true'
        run: command -v pdftotext || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils)

      # The documents college-reported runs archived (.cache/college-docs/), restored only: a document missing here is
      # fetched again by URL and used only when its sha256 matches.
      - name: Restore document cache
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .cache/college-docs
          key: college-docs-steward-${{ github.run_id }}
          restore-keys: |
            college-docs-

      # Exit 2: the budget stopped the run (what it wrote stays; the run record says where). Not a failure.
      - name: Run the Steward
        if: steps.secrets.outputs.ready == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COLLEGE_DOCS_REPO: ${{ vars.COLLEGE_DOCS_REPO }}
          COLLEGE_REPORTED_TOKEN: ${{ secrets.COLLEGE_REPORTED_TOKEN }}
          MODE: ${{ steps.params.outputs.mode }}
          BUDGET: ${{ steps.params.outputs.budget }}
          CAUSE: ${{ inputs.cause }}
          UNIT: ${{ inputs.unit }}
          PROPOSAL: ${{ inputs.proposal }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          set +e
          npm run steward -- --store supabase --mode "$MODE" --budget "$BUDGET" --run-ref "steward-${{ github.run_id }}" \
            ${CAUSE:+--cause "$CAUSE"} ${UNIT:+--unit "$UNIT"} ${PROPOSAL:+--proposal "$PROPOSAL"} ${REQUEST_ID:+--request-id "$REQUEST_ID"}
          code=$?
          if [ "$code" -eq 2 ]; then
            echo "::notice::The budget stopped the run; what it wrote is in the console (Issues, Proposals)."
            exit 0
          fi
          exit "$code"

  apply:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'apply'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # actions: write is what starting publish-snapshot.yml needs; nothing is pushed.
    permissions:
      contents: read
      actions: write
    steps:
      - name: Check the input and the data store
        id: secrets
        env:
          PROPOSAL: ${{ inputs.proposal }}
        run: |
          if [ -z "$PROPOSAL" ]; then echo "::error::mode apply needs a proposal"; exit 1; fi
          if [ -z "$DATA_SUPABASE_URL" ] || [ -z "$DATA_SUPABASE_SECRET_KEY" ]; then
            echo "::notice::DATA_SUPABASE_URL or DATA_SUPABASE_SECRET_KEY is not set; nothing applied."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: 24
          cache: npm

      - run: npm ci
        if: steps.secrets.outputs.ready == 'true'

      - name: Fetch the current snapshot
        if: steps.secrets.outputs.ready == 'true'
        env:
          DATA_SNAPSHOT_URL: ${{ vars.DATA_SNAPSHOT_URL }}
        run: |
          export DATA_SNAPSHOT_URL="${DATA_SNAPSHOT_URL:-${DATA_SUPABASE_URL%/}/storage/v1/object/public/snapshots}"
          npm run fetch-snapshot

      - name: Apply the proposal
        id: apply
        if: steps.secrets.outputs.ready == 'true'
        env:
          PROPOSAL: ${{ inputs.proposal }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: npm run steward -- --store supabase --mode apply --proposal "$PROPOSAL" --run-ref "steward-apply-${{ github.run_id }}" ${REQUEST_ID:+--request-id "$REQUEST_ID"}

      # Only a hold or a refile changes what a snapshot composes.
      - name: Ask the publisher for a snapshot
        if: steps.apply.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish-snapshot.yml --repo "${{ github.repository }}"

  # The job review: one run of one job, read and compared with its expectations (scripts/lib/steward/review.mts).
  review:
    if: github.event_name == 'workflow_run' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'review')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # actions: write is for the review's two dispatches only: starting a restartable job's own workflow again, or the
    # publisher (the script refuses any other workflow). Nothing is pushed.
    permissions:
      contents: read
      actions: write
    steps:
      # Which job and run: the completed workflow's file (workflow_run), or the dispatch's job and run inputs.
      - name: Resolve the job and the run
        id: target
        env:
          EVENT: ${{ github.event_name }}
          WF_PATH: ${{ github.event.workflow_run.path }}
          WF_RUN: ${{ github.event.workflow_run.id }}
          WF_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          IN_JOB: ${{ inputs.job }}
          IN_RUN: ${{ inputs.run }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT" = "workflow_run" ]; then
            case "${WF_PATH##*/}" in
              college-reported.yml) job=college-reported ;;
              identity-refresh.yml) job=identity-refresh ;;
              visit-events.yml) job=visit-events ;;
              publish-snapshot.yml) job=publish-snapshot ;;
              sync-data.yml) job=sync-data ;;
              sync-history.yml) job=sync-history ;;
              *) echo "::notice::No job for ${WF_PATH}; nothing to review."; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
            esac
            run="$WF_RUN"
            # The half-hourly collect that found no open batch (its run job skipped, no work step succeeded) has nothing
            # to review; skipping it here saves a checkout every 30 minutes.
            if [ "$job" = "college-reported" ] && [ "$WF_CONCLUSION" = "success" ]; then
              busy=$(gh api "repos/$REPO/actions/runs/$run/jobs" --jq '[.jobs[] | select(.name == "run" and .conclusion != "skipped")] + [.jobs[].steps[] | select((.name == "Run the ingestion pipeline" or .name == "Collect the open batches") and .conclusion == "success")] | length')
              if [ "${busy:-0}" -eq 0 ]; then
                echo "college-reported run $run was a collect firing with nothing to collect; no review."
                echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
              fi
            fi
          else
            job="$IN_JOB"; run="$IN_RUN"
          fi
          if ! [[ "$job" =~ ^[a-z][a-z0-9-]{0,40}$ ]]; then echo "::error::job must be a job id"; exit 1; fi
          if ! [[ "$run" =~ ^[0-9]{1,20}$ ]]; then echo "::error::run must be a run id"; exit 1; fi
          {
            echo "go=true"
            echo "job=$job"
            echo "run=$run"
          } >> "$GITHUB_OUTPUT"

      # The data store is needed; the API key isn't (without it the review has no note).
      - name: Check the data store
        id: secrets
        if: steps.target.outputs.go == 'true'
        run: |
          if [ -z "$DATA_SUPABASE_URL" ] || [ -z "$DATA_SUPABASE_SECRET_KEY" ]; then
            echo "::notice::DATA_SUPABASE_URL or DATA_SUPABASE_SECRET_KEY is not set; no review."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: 24
          cache: npm

      - run: npm ci
        if: steps.secrets.outputs.ready == 'true'

      # CRON_SECRET and SITE_URL are optional: with both, a failed restartable Vercel job can be started again.
      - name: Review the run
        if: steps.secrets.outputs.ready == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ vars.SITE_URL }}
          JOB: ${{ steps.target.outputs.job }}
          RUN: ${{ steps.target.outputs.run }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: npm run steward -- --store supabase --mode review --job "$JOB" --run "$RUN" --run-ref "steward-review-${{ github.run_id }}" ${REQUEST_ID:+--request-id "$REQUEST_ID"}

# Reads colleges' essay prompts pages (scripts/sync-essay-prompts.mts; specs/product/essays/prompts.md) where the
# Anthropic key lives (the repository secret ANTHROPIC_API_KEY; there is no key in local .env files), applies the
# passing records to data/schools.json (npm run merge-essay-prompts), checks lineage, and opens a data PR with the
# run's counts, the held records, and its own release note, as the college-reported workflow does. Never auto-merges:
# the owner reviews each PR. Dispatched by hand only (the owner runs it): the first wave is `top: 200`, then units.
#
# Checkout and the git/gh steps use secrets.COLLEGE_REPORTED_TOKEN when it's set (so the PR triggers Verify), falling
# back to github.token. COLLEGE_DOCS_REPO, when set, keeps every page read in the GitHub-release archive.
name: Essay prompts

on:
  workflow_dispatch:
    inputs:
      units:
        description: Unit ids to read, comma-separated (overrides top when set)
        type: string
        default: ""
      top:
        description: Read the N colleges with the most applicants (used when units is empty)
        type: string
        default: "200"
      budget:
        description: Stop the run (keeping finished colleges) before a call that could pass this many US dollars
        type: string
        default: "40"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: essay-prompts
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.COLLEGE_REPORTED_TOKEN || github.token }}

      - name: Check the API key
        run: |
          if [ -z "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            echo "::error::ANTHROPIC_API_KEY is not set (repository secret)."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Read the essay pages
        id: sync
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COLLEGE_DOCS_REPO: ${{ vars.COLLEGE_DOCS_REPO }}
          COLLEGE_REPORTED_TOKEN: ${{ secrets.COLLEGE_REPORTED_TOKEN }}
          UNITS: ${{ inputs.units }}
          TOP: ${{ inputs.top }}
          BUDGET: ${{ inputs.budget }}
        run: |
          set +e
          if [ -n "$UNITS" ]; then
            npm run sync-essay-prompts -- --units "$UNITS" --budget "${BUDGET:-40}"
          else
            npm run sync-essay-prompts -- --top "${TOP:-200}" --budget "${BUDGET:-40}"
          fi
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          # 3 = stopped early (budget or key): the colleges finished still go to the PR.
          if [ "$code" != "0" ] && [ "$code" != "3" ]; then exit "$code"; fi

      - name: Apply the records and check lineage
        run: |
          npm run merge-essay-prompts
          npm run check:lineage

      - name: Check for data changes
        id: diff
        run: |
          if git status --porcelain -- data | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes under data/ this run; nothing to open a PR for."
          fi

      - name: Open a pull request
        id: pr
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.COLLEGE_REPORTED_TOKEN || github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          branch="data/essay-prompts-${RUN_ID}"
          git checkout -b "$branch"
          git add data
          printf 'Essay prompts: run %s\n\nCo-Authored-By: Claude Opus 5 <noreply@anthropic.com>\n' "$RUN_ID" > /tmp/essay-prompts-commit-msg.txt
          git -c user.name="essay-prompts-bot" -c user.email="noreply@anthropic.com" commit -F /tmp/essay-prompts-commit-msg.txt
          git push -u origin "$branch"
          npm run --silent sync-essay-prompts -- --report body > /tmp/essay-prompts-pr-body.md
          gh pr create --base main --head "$branch" \
            --title "Essay prompts: run ${RUN_ID}" \
            --body-file /tmp/essay-prompts-pr-body.md
          number=$(gh pr view "$branch" --json number -q .number)
          echo "number=$number" >> "$GITHUB_OUTPUT"

      # The PR number is only known once the PR exists, so the release note (specs/release-notes.md) is written and
      # pushed as a second commit onto the same branch, naming it.
      - name: Add the release note
        if: steps.diff.outputs.changed == 'true' && steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.COLLEGE_REPORTED_TOKEN || github.token }}
          RUN_ID: ${{ github.run_id }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          date=$(date -u +%Y-%m-%d)
          note="release-notes/essay-prompts-${RUN_ID}.md"
          npm run --silent sync-essay-prompts -- --report note --pr "$PR_NUMBER" --date "$date" --out "$note"
          git add "$note"
          printf 'Release note for #%s\n\nCo-Authored-By: Claude Opus 5 <noreply@anthropic.com>\n' "$PR_NUMBER" > /tmp/essay-prompts-note-msg.txt
          git -c user.name="essay-prompts-bot" -c user.email="noreply@anthropic.com" commit -F /tmp/essay-prompts-note-msg.txt
          git push

      - name: Say why this PR waits for a person
        if: steps.diff.outputs.changed == 'true' && steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.COLLEGE_REPORTED_TOKEN || github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          EXIT_CODE: ${{ steps.sync.outputs.exit_code }}
        run: |
          reason="essay prompts PRs never auto-merge — review the held records and merge by hand once CI is green"
          if [ "$EXIT_CODE" = "3" ]; then
            reason="the run stopped early (its budget, or the API key was refused); this PR holds the colleges it finished — ${reason}"
          fi
          gh pr comment "$PR_NUMBER" --body "Waiting for a person: ${reason}."

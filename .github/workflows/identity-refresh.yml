# Runs the monthly identity refresh (specs/school-identity/follow-ups.md, "The monthly refresh"): re-syncs Wikidata
# social accounts, re-probes every college's own site for its visit page, footer accounts, icon candidates, and link
# liveness, and re-reads Wikipedia's college colors. The three scripts write the identity layers (identity.*) of the
# data store in one change set (source identity-refresh), which this workflow opens first and closes last
# (scripts/data-change-set.mts; specs/data-platform/pipelines.md). A run whose steps all finished closes the set
# applied and asks the publisher for a snapshot (repository_dispatch publish-snapshot); a run where a step failed
# closes it held, with the reason, and the console's Holds shows it. No commit, no pull request, no release note.
#
# The marks (public/brand/*.webp) are image files in the code, not data: this workflow re-reads colors only
# (sync-brand --colors). Refresh the marks locally (npm run sync-brand -- --icons --store supabase) and commit
# public/brand/ in a code PR.
#
# Secrets: DATA_SUPABASE_URL and DATA_SUPABASE_SECRET_KEY (the data project; PROD_SUPABASE_* as the fallback, as
# publish-snapshot.yml). Every source here is free and unauthenticated (Wikidata, Wikipedia, each college's own site
# with a polite, honest user agent). The default token sends the dispatch (repository_dispatch is one of the events a
# GITHUB_TOKEN may start a run with).
name: Identity refresh

# The admin console passes request_id on dispatch so it can find its run (specs/product/admin.md, "Reruns"); a run
# without one keeps GitHub's usual title.
run-name: "${{ inputs.request_id && format('{0} · {1}', github.workflow, inputs.request_id) || github.workflow }}"

on:
  workflow_dispatch:
    inputs:
      force:
        description: Run even if the last site probe is less than 28 days old
        type: boolean
        default: false
      request_id:
        description: Set by the admin console to find its run; leave empty
        type: string
        default: ""
  schedule:
    - cron: "0 6 * * *" # daily 06:00 UTC; the "Check whether a refresh is due" step below decides whether this firing does anything

permissions:
  contents: write # the publish-snapshot dispatch

concurrency:
  group: identity-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DATA_SUPABASE_URL: ${{ secrets.DATA_SUPABASE_URL || secrets.PROD_SUPABASE_URL }}
      DATA_SUPABASE_SECRET_KEY: ${{ secrets.DATA_SUPABASE_SECRET_KEY || secrets.PROD_SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Check the data project's secrets
        id: secrets
        run: |
          if [ -z "$DATA_SUPABASE_URL" ] || [ -z "$DATA_SUPABASE_SECRET_KEY" ]; then
            echo "::notice::DATA_SUPABASE_URL or DATA_SUPABASE_SECRET_KEY is not set; skipping this run."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # identity.probe's newest `retrieved` date, compared with today (specs/school-identity/follow-ups.md).
      - name: Check whether a refresh is due
        id: due
        if: steps.secrets.outputs.ready == 'true'
        run: |
          due=$(node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/identity-refresh.mts due --store supabase)
          echo "due=$due" >> "$GITHUB_OUTPUT"

      - name: Decide whether to proceed
        id: gate
        if: steps.secrets.outputs.ready == 'true'
        env:
          DUE: ${{ steps.due.outputs.due }}
        run: |
          # inputs.* only exists on a workflow_dispatch run; branch in bash rather than reference it directly in an
          # expression, so a schedule-triggered run never evaluates it at all.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            force="${{ inputs.force }}"
          else
            force="false"
          fi
          if [ "$force" = "true" ] || [ "$DUE" = "true" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipping: the last site probe is less than 28 days old (due=$DUE) and force was not set."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

      # Keyed per run (so it always saves the latest state at the end) with a prefix restore-key (so it always
      # restores the newest prior entry).
      - name: Restore identity caches (Wikipedia, Wikidata)
        if: steps.secrets.outputs.ready == 'true' && steps.gate.outputs.proceed == 'true'
        uses: actions/cache@v4
        with:
          path: |
            .cache/wikipedia
            .cache/wikidata
          key: identity-refresh-${{ github.run_id }}
          restore-keys: |
            identity-refresh-

      # One change set for the whole run; each script below writes into it.
      - name: Open the change set
        id: change_set
        if: steps.secrets.outputs.ready == 'true' && steps.gate.outputs.proceed == 'true'
        run: |
          id=$(node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/data-change-set.mts open --store supabase --source identity-refresh --run-ref "$GITHUB_RUN_ID")
          echo "id=$id" >> "$GITHUB_OUTPUT"

      # Social accounts, other names, the Wikipedia article link (identity.wikidata). Wikidata only; no key.
      - name: Sync Wikidata
        if: steps.gate.outputs.proceed == 'true'
        id: sync_wikidata
        run: npm run sync-wikidata -- --store supabase --change-set "${{ steps.change_set.outputs.id }}"

      # The campus visit page, footer social links, icon candidates, and stored-link liveness (identity.probe,
      # identity.link_issues). Each college's own site only, politely; no key. ~20 minutes.
      - name: Probe every college's site
        if: steps.gate.outputs.proceed == 'true'
        id: probe_sites
        run: npm run probe-sites -- --store supabase --change-set "${{ steps.change_set.outputs.id }}"

      # Colors from Wikipedia's college color data (identity.brand_colors). Wikipedia only; no key.
      - name: Sync brand colors
        if: steps.gate.outputs.proceed == 'true'
        id: sync_brand
        run: npm run sync-brand -- --colors --store supabase --change-set "${{ steps.change_set.outputs.id }}"

      # The console's health document (health.colleges) counts link issues and brand gaps, so it is rebuilt into the
      # same change set after an identity refresh (scripts/college-health.mts reads the store).
      - name: Rebuild the health document
        if: steps.gate.outputs.proceed == 'true'
        id: college_health
        run: npm run college-health -- --store supabase --change-set "${{ steps.change_set.outputs.id }}"

      # always(): a step above can fail partway through (e.g. probe-sites' ~20-minute run hitting the job timeout)
      # while an earlier one still wrote real changes; the set is closed either way, held when anything failed.
      - name: Close the change set
        id: close
        if: always() && steps.change_set.outputs.id != ''
        env:
          ID: ${{ steps.change_set.outputs.id }}
          WIKIDATA_OK: ${{ steps.sync_wikidata.outcome }}
          PROBE_OK: ${{ steps.probe_sites.outcome }}
          BRAND_OK: ${{ steps.sync_brand.outcome }}
        run: |
          if [ "$WIKIDATA_OK" = "success" ] && [ "$PROBE_OK" = "success" ] && [ "$BRAND_OK" = "success" ]; then
            node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/data-change-set.mts close --store supabase --id "$ID" --status applied
            echo "status=applied" >> "$GITHUB_OUTPUT"
          else
            reason="Not every identity step finished (sync-wikidata: ${WIKIDATA_OK:-n/a}, probe-sites: ${PROBE_OK:-n/a}, sync-brand: ${BRAND_OK:-n/a}); this set holds whatever finished before the failure"
            node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/data-change-set.mts close --store supabase --id "$ID" --status held --reason "$reason"
            echo "status=held" >> "$GITHUB_OUTPUT"
          fi

      # The run's tail: ask the publisher for a snapshot, unless the set was held (the console shows the hold).
      - name: Ask the publisher for a snapshot
        if: always() && steps.close.outputs.status == 'applied'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${{ github.repository }}/dispatches" -f event_type=publish-snapshot
